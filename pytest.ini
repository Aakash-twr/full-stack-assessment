[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Disable asyncio mode (all our tests are synchronous)
asyncio_mode = auto

# Output verbosity — show each test name
addopts =
    -v
    --tb=short
    --strict-markers

# Custom markers
markers =
    slow: marks tests that take > 10 s (e.g. real 30-second processing)
    integration: marks tests that require a live MySQL instance

# Minimum pytest version
minversion = 8.0
